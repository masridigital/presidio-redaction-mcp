name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Fixture header and recall gates
        run: python scripts/generate_fixtures.py && git diff --exit-code tests/fixtures
      - name: Pytest
        run: pytest -m "not native"
      - name: SAST
        run: bandit -r src -ll -q
      - name: Dependency scan
        run: pip-audit -r requirements.txt -r requirements-dev.txt
      - name: SBOM
        run: cyclonedx-py environment --of JSON -o sbom.json
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck deploy/install.sh
      - name: gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose

  presidio-native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install proxy and native Presidio
        run: |
          python -m pip install --require-hashes -r requirements.txt -r requirements-dev.txt -r requirements-presidio.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Native Presidio compatibility and recall
        env:
          PRM_REQUIRE_NATIVE: "1"
        run: pytest -m native

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U "pip>=26.2"
          pip install -e ".[dev]"
      - name: Fixture header and recall gates
        run: python scripts/generate_fixtures.py && git diff --exit-code tests/fixtures
      - name: Pytest
        run: pytest
      - name: SAST
        run: bandit -r src -ll -q
      - name: Dependency scan
        run: pip-audit
      - name: SBOM
        run: cyclonedx-py environment --output-format JSON --outfile sbom.json
      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck deploy/install.sh
      - name: gitleaks
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose

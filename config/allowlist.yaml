# Day-1 allowlist. Default deny. Exactly stackjack and composio.
# Expansions require a Marko review and a new Cap decision.
version: 1
recognizers_file: recognizers.yaml
max_payload_bytes: 262144
presidio:
  analyzer_url: https://presidio-tls/analyze
  anonymizer_url: https://presidio-tls/anonymize
  timeout_seconds: 5
  score_threshold: 0.4
egress:
  # Phase 1 mocks do not dial the network. Real vendor hosts stay off this list
  # until their Cloudflare-proxy status is verified. .invalid cannot resolve.
  upstream_hosts:
    - stackjack.invalid
    - composio.invalid
  presidio_hosts:
    - presidio-tls
  test_hosts:
    - 127.0.0.1
    - localhost
    - testserver
    - presidio.test
callers:
  grok-bot:
    phi_capable: false
    allowed_ingress:
      - cloudflare
    token_secret: grok_bot_token
    cf_access_client_id_secret: grok_cf_access_client_id
    cf_access_client_secret_secret: grok_cf_access_client_secret
  claude-local:
    phi_capable: true
    allowed_ingress:
      - vpn
    token_secret: claude_local_token
  open-webui:
    phi_capable: true
    allowed_ingress:
      - vpn
    token_secret: open_webui_token
upstreams:
  stackjack:
    kind: stackjack
    mode: mock
    base_url: https://stackjack.invalid/mcp
    tools:
      - name: stackjack_health_check
        description: StackJack process liveness. No customer records.
        rationale: Liveness only. No tickets, transcripts, or client records.
        read_only: true
        phi_scope: none
        max_items: 5
        allowed_result_fields: [status, summary]
        arguments:
          - name: limit
            type: integer
      - name: stackjack_get_service_status
        description: StackJack service status fields only.
        rationale: Status metadata. No support-ticket or tenant content.
        read_only: true
        phi_scope: none
        max_items: 5
        allowed_result_fields: [status, summary]
        arguments:
          - name: limit
            type: integer
      - name: stackjack_list_advisories
        description: Published StackJack security advisories, one page.
        rationale: Product security advisories. Paginated. Not a client export.
        read_only: true
        phi_scope: none
        max_items: 20
        allowed_result_fields: [status, summary, items, id, type, interval]
        arguments:
          - name: limit
            type: integer
          - name: cursor
            type: string
            max_length: 128
            pattern: '^[A-Za-z0-9._:-]{0,128}$'
      - name: stackjack_get_release_notes
        description: Product changelog for one version id.
        rationale: Public product notes addressed by an opaque version id.
        read_only: true
        phi_scope: none
        max_items: 5
        allowed_result_fields: [status, summary]
        arguments:
          - name: doc_id
            type: string
            max_length: 64
            pattern: '^[A-Za-z0-9._:-]{1,64}$'
      - name: stackjack_search_docs
        description: Search public StackJack documentation.
        rationale: Public docs search. Query text is still redacted before the mock upstream.
        read_only: true
        phi_scope: none
        max_items: 10
        allowed_result_fields: [status, summary, items, id]
        arguments:
          - name: query
            type: string
            max_length: 200
          - name: limit
            type: integer
      - name: stackjack_get_doc_page
        description: Fetch one public documentation page by id.
        rationale: One public page. The id is an opaque slug, not a name or record id.
        read_only: true
        phi_scope: none
        max_items: 5
        allowed_result_fields: [status, summary]
        arguments:
          - name: doc_id
            type: string
            max_length: 64
            pattern: '^[A-Za-z0-9._:-]{1,64}$'
  composio:
    kind: composio
    mode: mock
    base_url: https://composio.invalid/mcp
    tools:
      - name: UPTIMEROBOT_GET_MONITORS
        description: UptimeRobot monitor id, status, type, and interval.
        rationale: Availability metadata for one pinned connected account. Contact, URL, and friendly-name fields are not allowlisted. alert_contacts and search arguments are not in the schema.
        read_only: true
        phi_scope: none
        max_items: 20
        toolkit: UPTIMEROBOT
        action_id: UPTIMEROBOT_GET_MONITORS
        connected_account_id: ca_day1_uptimerobot_nonphi_ro
        allowed_result_fields: [status, summary, items, id, type, interval]
        arguments:
          - name: limit
            type: integer
          - name: cursor
            type: string
            max_length: 128
            pattern: '^[A-Za-z0-9._:-]{0,128}$'
      - name: UPTIMEROBOT_GET_ACCOUNT_DETAILS
        description: UptimeRobot plan and capacity fields only.
        rationale: Account metrics for the same pinned connected account. Email and contact fields are not allowlisted.
        read_only: true
        phi_scope: none
        max_items: 5
        toolkit: UPTIMEROBOT
        action_id: UPTIMEROBOT_GET_ACCOUNT_DETAILS
        connected_account_id: ca_day1_uptimerobot_nonphi_ro
        allowed_result_fields: [status, summary]
        arguments:
          - name: limit
            type: integer

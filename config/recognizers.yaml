# Patterns for the synthetic fixture corpus only. They are not a HIPAA identifier catalog.
recognizers:
  - name: synthetic_mrn
    entity: MRN
    patterns:
      - name: mrn_canonical
        regex: '\bMRN-SYN-\d{7}\b'
        score: 0.95
      - name: mrn_spaced
        regex: '(?i)\bm\s*r\s*n\s*-\s*s\s*y\s*n\s*-\s*(?:\d\s*){7}'
        score: 0.85
  - name: synthetic_record
    entity: RECORD_ID
    patterns:
      - name: record_canonical
        regex: '\bREC-SYN-\d{6}\b'
        score: 0.95
  - name: synthetic_account
    entity: ACCOUNT_ID
    patterns:
      - name: account_canonical
        regex: '\bACCT-SYN-\d{8}\b'
        score: 0.95
  - name: synthetic_npi
    entity: NPI
    patterns:
      - name: npi_canonical
        regex: '\bNPI-SYN-\d{10}\b'
        score: 0.95
  - name: synthetic_ssn
    entity: US_SSN
    patterns:
      - name: ssn_dashed
        regex: '\b(?:000-00-0000|666-12-3456|900-00-0001)\b'
        score: 0.95
      - name: ssn_dotted
        regex: '\b(?:000\.00\.0000|666\.12\.3456|900\.00\.0001)\b'
        score: 0.9
  - name: synthetic_email
    entity: EMAIL_ADDRESS
    patterns:
      - name: example_email
        regex: '(?<![A-Za-z0-9._%+-])[A-Za-z0-9._%+-]+@example\.(?:com|org)\b'
        score: 0.9
  - name: synthetic_phone
    entity: PHONE_NUMBER
    patterns:
      - name: fictional_555
        regex: '\b555-01[0-9]{2}\b'
        score: 0.9
  - name: synthetic_dob
    entity: DATE_OF_BIRTH
    patterns:
      - name: implausible_dob
        regex: '\b(?:1900-01-01|1901-02-02)\b'
        score: 0.9
  - name: synthetic_card
    entity: CREDIT_CARD
    patterns:
      - name: test_pan
        regex: '\b4111[ -]1111[ -]1111[ -]1111\b'
        score: 0.95
  - name: synthetic_location
    entity: LOCATION
    patterns:
      - name: fake_street
        regex: '123 Fake Street, Testville, ZZ 00000'
        score: 0.95
deny_list:
  - entity: PERSON
    terms:
      - Testy McFakerson
      - Jane Synthetic-Doe
      - Pat Placeholder

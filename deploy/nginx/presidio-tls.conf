worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;
    client_body_buffer_size 16k;
    server_tokens off;

    server {
        listen 8443 ssl;
        server_name presidio-tls;
        ssl_certificate /run/secrets/internal_tls_cert;
        ssl_certificate_key /run/secrets/internal_tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / {
            proxy_pass http://presidio-analyzer:3000;
            proxy_set_header Host presidio-analyzer;
        }
    }

    server {
        listen 8444 ssl;
        server_name presidio-tls;
        ssl_certificate /run/secrets/internal_tls_cert;
        ssl_certificate_key /run/secrets/internal_tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / {
            proxy_pass http://presidio-anonymizer:3000;
            proxy_set_header Host presidio-anonymizer;
        }
    }
}
